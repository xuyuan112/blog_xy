# 宝塔面板 - 后台管理系统 Nginx 反向代理配置
# 使用位置: 宝塔面板 -> 网站 -> 后台管理站点 -> 设置 -> 配置文件
# 添加到 server { } 内 (与原有 location / 平级, 必须放在 location / 之前)

location /xuyuan/ {
    # proxy_pass 不带尾部斜杠 => 路径原样转发
    # 浏览器请求 /xuyuan/auth/captcha -> 后端 http://127.0.0.1:8080/xuyuan/auth/captcha
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 文件上传 (max-request-size 100MB)
    client_max_body_size 100m;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 注意事项:
# 1. 如果站点同时托管前台 (frontend-firefly), 前台也是请求 /xuyuan/**, 这条 location 两者通用。
# 2. 不要使用宝塔自带的"反向代理"按钮再叠加一层, 直接改配置文件即可。
# 3. 改完保存后 Nginx 会自动 reload, 无需重启。
