server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    default: local
  application:
    name: blog-admin
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL:jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8}
    username: ${BLOG_DB_USERNAME:root}
    password: ${BLOG_DB_PASSWORD:}
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 # 数据库连接超时时间,默认30秒
      idle-timeout: 500000 # 空闲连接存活最大时间,默认600000(10分钟)
      max-lifetime: 540000 # 此属性控制池中连接的最长生命周期,值0表示无限生命周期,默认1800000即30分钟
      maximum-pool-size: 12 # 连接池最大连接数,默认是10
      minimum-idle: 10 # 最小空闲连接数量
      pool-name: SPHHikariPool # 连接池名称
  jackson:
    time-zone: GMT+8
  data:
    redis:
      host: ${BLOG_REDIS_HOST:127.0.0.1}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.xuyuan.blog.model.entity
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${BLOG_JWT_SECRET:change-this-in-production-with-a-32-byte-secret}
  access-expire: 7200
  refresh-expire: 604800
  issuer: blog-admin

minio:
  enabled: ${BLOG_MINIO_ENABLED:true}
  endpoint: ${BLOG_MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${BLOG_MINIO_ACCESS_KEY:}
  secret-key: ${BLOG_MINIO_SECRET_KEY:}
  bucket: ${BLOG_MINIO_BUCKET:blog}

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# SpringDoc OpenAPI 配置(分组由 Knife4jConfiguration 类管理)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
