server:
  port: 8081
  servlet:
    context-path: /

spring:
  profiles:
    default: local
  application:
    name: blog-web
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL:jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BLOG_DB_USERNAME:root}
    password: ${BLOG_DB_PASSWORD:}
  data:
    redis:
      host: ${BLOG_REDIS_HOST:127.0.0.1}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.xuyuan.blog.model.entity

jwt:
  secret: ${BLOG_JWT_SECRET:change-this-in-production-with-a-32-byte-secret}
  access-expire: 1800
  refresh-expire: 604800
  issuer: blog-web

minio:
  enabled: ${BLOG_MINIO_ENABLED:false}
  endpoint: ${BLOG_MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${BLOG_MINIO_ACCESS_KEY:}
  secret-key: ${BLOG_MINIO_SECRET_KEY:}
  bucket: ${BLOG_MINIO_BUCKET:blog}

amap:
  weather-key: ${AMAP_WEATHER_KEY:}
  city-code: ${AMAP_CITY_CODE:330100}

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# SpringDoc OpenAPI 配置(分组由 Knife4jConfiguration 类管理)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
